[theme]
base = "light"
primaryColor = "#003D83"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#233247"
font = "sans-serif"
baseFontSize = 15
borderColor = "#788CA2"
showWidgetBorder = true
headingFontSizes = ["27px", "27px", "17px", "14px", "14px", "14px"]
