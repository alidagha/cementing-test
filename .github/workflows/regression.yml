name: Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-gate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      SHADOW_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$SHADOW_EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Fast gate
        run: python -B -m pytest test_regression_guardrails.py -v

  shadow-collection:
    if: github.event_name == 'pull_request'
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHADOW_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$SHADOW_EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Collect the complete original tree without executing tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -B tools/round17_shadow.py run --role collect --directory "$RUNNER_TEMP/shadow-collection" 2>&1 | tee "$RUNNER_TEMP/shadow-launch.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-collection-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shadow-collection/manifest.json
            ${{ runner.temp }}/shadow-collection/metadata.json
            ${{ runner.temp }}/shadow-collection/observation.json
            ${{ runner.temp }}/shadow-collection/process.json
            ${{ runner.temp }}/shadow-collection/certification.log
            ${{ runner.temp }}/shadow-collection/checksums.json
          retention-days: 7
          if-no-files-found: error

  shadow-modules:
    if: github.event_name == 'pull_request'
    needs: shadow-collection
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [A, B, C]
    env:
      SHADOW_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$SHADOW_EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - uses: actions/download-artifact@v4
        with:
          name: shadow-collection-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collection-input
      - name: Full discovery then visible whole-module routing
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -B tools/round17_shadow.py run --role "${{ matrix.shard }}" --directory "$RUNNER_TEMP/shadow-${{ matrix.shard }}" --reference "$RUNNER_TEMP/collection-input/manifest.json" 2>&1 | tee "$RUNNER_TEMP/shadow-launch.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-${{ matrix.shard }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shadow-${{ matrix.shard }}/manifest.json
            ${{ runner.temp }}/shadow-${{ matrix.shard }}/metadata.json
            ${{ runner.temp }}/shadow-${{ matrix.shard }}/observation.json
            ${{ runner.temp }}/shadow-${{ matrix.shard }}/process.json
            ${{ runner.temp }}/shadow-${{ matrix.shard }}/certification.log
            ${{ runner.temp }}/shadow-${{ matrix.shard }}/checksums.json
            ${{ runner.temp }}/shadow-${{ matrix.shard }}/junit.xml
          retention-days: 7
          if-no-files-found: error

  # Required check: never skipped on a PR or a protected-main push.
  regression:
    if: ${{ always() }}
    needs: [fast-gate, shadow-collection, shadow-modules]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      SHADOW_NEEDS_JSON: ${{ toJSON(needs) }}
      SHADOW_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$SHADOW_EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed dependency gate
        run: python -B tools/round17_shadow.py gate --event "$GITHUB_EVENT_NAME"
      - name: Install pinned dependencies for PR evidence certification
        if: github.event_name == 'pull_request'
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: shadow-collection-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collection-input
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: shadow-A-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/A-input
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: shadow-B-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/B-input
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: shadow-C-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/C-input
      - name: Independently certify all three execution shards
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -B tools/round17_shadow.py compare --collection "$RUNNER_TEMP/collection-input" --A "$RUNNER_TEMP/A-input" --B "$RUNNER_TEMP/B-input" --C "$RUNNER_TEMP/C-input" --output "$RUNNER_TEMP/three-runner-certification" 2>&1 | tee "$RUNNER_TEMP/regression.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'pull_request' }}
        with:
          name: regression-evidence-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/regression.log
            ${{ runner.temp }}/three-runner-certification/certification.json
            ${{ runner.temp }}/three-runner-certification/job_results.json
            ${{ runner.temp }}/three-runner-certification/aggregate_checksums.json
            ${{ runner.temp }}/three-runner-certification/collection/manifest.json
            ${{ runner.temp }}/three-runner-certification/collection/metadata.json
            ${{ runner.temp }}/three-runner-certification/collection/observation.json
            ${{ runner.temp }}/three-runner-certification/collection/process.json
            ${{ runner.temp }}/three-runner-certification/collection/certification.log
            ${{ runner.temp }}/three-runner-certification/collection/checksums.json
            ${{ runner.temp }}/three-runner-certification/A/manifest.json
            ${{ runner.temp }}/three-runner-certification/A/metadata.json
            ${{ runner.temp }}/three-runner-certification/A/observation.json
            ${{ runner.temp }}/three-runner-certification/A/process.json
            ${{ runner.temp }}/three-runner-certification/A/certification.log
            ${{ runner.temp }}/three-runner-certification/A/checksums.json
            ${{ runner.temp }}/three-runner-certification/A/junit.xml
            ${{ runner.temp }}/three-runner-certification/B/manifest.json
            ${{ runner.temp }}/three-runner-certification/B/metadata.json
            ${{ runner.temp }}/three-runner-certification/B/observation.json
            ${{ runner.temp }}/three-runner-certification/B/process.json
            ${{ runner.temp }}/three-runner-certification/B/certification.log
            ${{ runner.temp }}/three-runner-certification/B/checksums.json
            ${{ runner.temp }}/three-runner-certification/B/junit.xml
            ${{ runner.temp }}/three-runner-certification/C/manifest.json
            ${{ runner.temp }}/three-runner-certification/C/metadata.json
            ${{ runner.temp }}/three-runner-certification/C/observation.json
            ${{ runner.temp }}/three-runner-certification/C/process.json
            ${{ runner.temp }}/three-runner-certification/C/certification.log
            ${{ runner.temp }}/three-runner-certification/C/checksums.json
            ${{ runner.temp }}/three-runner-certification/C/junit.xml
          retention-days: 7
          if-no-files-found: error
