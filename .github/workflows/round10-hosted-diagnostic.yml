name: Round 10 hosted timeout diagnostic

on:
  push:
    branches: [diag/round10-hosted-timeout]

permissions:
  contents: read

jobs:
  hosted-timeout-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install the failed run's dependencies without a cache
        run: python -m pip install --no-cache-dir -r requirements.txt pytest==9.1.1
      - name: Original 30s methods and conditional runtime-only completion probe
        run: python -B .github/diagnostics/round10_timeout.py
      - name: Preserve diagnostic evidence, including original failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round10-hosted-timeout-evidence
          path: ${{ runner.temp }}/round10-hosted-timeout
          if-no-files-found: error
          retention-days: 7
